include:
  # This is the CENTRAL device (the dongle)
  - board: nice_nano_v2
    shield: sofle_dongle
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONF_FILE=sofle.conf

  # This is a PERIPHERAL device (the left half)
  - board: nice_nano_v2
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONF_FILE=sofle.conf

  # This is a PERIPHERAL device (the right half)
  - board: nice_nano_v2
    shield: sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONF_FILE=sofle.conf
  
  # This is a utility firmware to reset settings
  - board: nice_nano_v2
    shield: settings_reset